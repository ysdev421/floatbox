<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="114" fill="#0f1011"/>

  <!-- Inbox tray (受け取るボックス) -->
  <rect x="128" y="272" width="256" height="140" rx="20" fill="none" stroke="#5e6ad2" stroke-width="22"/>

  <!-- Arrow: thoughts flowing in -->
  <line x1="256" y1="104" x2="256" y2="288" stroke="#5e6ad2" stroke-width="22" stroke-linecap="round"/>
  <polyline points="204,236 256,292 308,236" fill="none" stroke="#5e6ad2" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dots inside box (captured thoughts) -->
  <circle cx="196" cy="340" r="12" fill="#5e6ad2" opacity="0.5"/>
  <circle cx="256" cy="340" r="12" fill="#5e6ad2" opacity="0.75"/>
  <circle cx="316" cy="340" r="12" fill="#5e6ad2"/>
</svg>
